name: CI
on: [push, pull_request]

# Least privilege by default; jobs that write declare it explicitly.
permissions: read-all
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: internal markdown links resolve
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path("src")
          bad = []
          link_re = re.compile(r"\[[^\]]*\]\(([^)#\s]+)(?:#[^)]+)?\)")
          for md in root.rglob("*.md"):
              for m in link_re.finditer(md.read_text(encoding="utf-8")):
                  url = m.group(1)
                  if "://" in url or url.startswith("mailto:"):
                      continue
                  target = (md.parent / url).resolve()
                  if not target.exists():
                      bad.append(f"{md}: {url}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("all internal links resolve")
          PY
      - name: SUMMARY chapters all exist
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path("src")
          text = (root / "SUMMARY.md").read_text(encoding="utf-8")
          urls = re.findall(r"\[[^\]]*\]\(\.(/[^)\s#]+)[^)]*\)", text)
          bad = [u for u in urls if not (root / u.lstrip("/")).exists()]
          if bad:
              print("SUMMARY targets missing:", *bad, sep="\n  ")
              sys.exit(1)
          print(f"SUMMARY targets all exist ({len(urls)} chapters)")
          PY
      - name: mdbook renders (real gate, not warnings-as-green)
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d  # v2.85.12
        with:
          tool: mdbook
      - run: mdbook build
      - name: no stale canonical names
        run: |
          # Same carve-out as rename_sweep2.py: regenerated audit artifacts
          # (exhaustive-audit + incident snapshots) and immutable history
          # (QUERYLOG, ADR records) quote the old world by definition; the
          # gate protects living docs only.
          ! grep -rniE "nexusaos|sheshaaos|auto-desktopenv" src/ \
              --exclude="AUDIT_*" \
              --exclude="exhaustive-audit.md" \
              --exclude="incident-*.md" \
              --exclude-dir=queries \
              --exclude-dir=adr \
          || { echo "stale names found — run the sweep"; exit 1; }
