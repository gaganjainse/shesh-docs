name: CI
on: [push, pull_request]

# Least privilege by default; jobs that write declare it explicitly.
permissions: read-all
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: internal markdown links resolve
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path("src")
          bad = []
          link_re = re.compile(r"\[[^\]]*\]\(([^)#\s]+)(?:#[^)]+)?\)")
          for md in root.rglob("*.md"):
              for m in link_re.finditer(md.read_text(encoding="utf-8")):
                  url = m.group(1)
                  if "://" in url or url.startswith("mailto:"):
                      continue
                  target = (md.parent / url).resolve()
                  if not target.exists():
                      bad.append(f"{md}: {url}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("all internal links resolve")
          PY
      - name: no stale canonical names
        run: |
          # Same carve-out as rename_sweep2.py: regenerated audit artifacts
          # (AUDIT_EXHAUSTIVE and dated AUDIT_* snapshots) and immutable
          # history (QUERYLOG, ADR records) quote the old world by definition;
          # the gate protects living docs only.
          ! grep -rniE "nexusaos|sheshaaos|auto-desktopenv" src/ \
              --exclude="AUDIT_*" \
              --exclude-dir=queries \
              --exclude-dir=adr \
          || { echo "stale names found — run the sweep"; exit 1; }
